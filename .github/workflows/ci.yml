name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Validate playground catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - run: node tools/validate-playgrounds.mjs

  current:
    name: Angular 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: angular-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: angular-22/package-lock.json
      - run: npm ci
      - run: npm run test:server
      - run: npm run build
      - run: npm audit --audit-level=low
